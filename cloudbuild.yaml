steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --build-arg
      - REACT_APP_BACKEND_URL=
      - -t
      - gcr.io/$PROJECT_ID/hisab-book:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/hisab-book:latest
      - .

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, 'gcr.io/$PROJECT_ID/hisab-book:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: [push, 'gcr.io/$PROJECT_ID/hisab-book:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hisab-book
      - --image=gcr.io/$PROJECT_ID/hisab-book:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1

images:
  - gcr.io/$PROJECT_ID/hisab-book:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/hisab-book:latest
